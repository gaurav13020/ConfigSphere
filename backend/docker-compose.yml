services:

  db:
    image: postgres:15-alpine
    container_name: configsphere_db
    environment:
      POSTGRES_DB: configsphere
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: configsphere_web
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  auth:
    build: ../auth-service
    container_name: configsphere_auth
    env_file:
      - ../auth-service/.env
    ports:
      - "8001:8001"
    volumes:
      - ../auth-service:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: configsphere_frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_AUTH_URL: http://localhost:8001/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - web
      - auth

volumes:
  postgres_data:
