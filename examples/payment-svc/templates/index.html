<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>payment-svc — ConfigSphere Live Config</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: #1a1d2e;
      border-bottom: 1px solid #2d3250;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { font-size: 1.25rem; font-weight: 600; color: #7c83d6; }
    header .service-badge {
      background: #2d3250;
      color: #a5b4fc;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .status-bar {
      background: #1a1d2e;
      border-bottom: 1px solid #2d3250;
      padding: 10px 32px;
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 0.8rem;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; display: inline-block;
      margin-right: 6px;
    }
    .connected .status-dot { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .disconnected .status-dot { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
    .status-label { font-weight: 600; }
    .connected .status-label { color: #22c55e; }
    .disconnected .status-label { color: #ef4444; }
    .meta { color: #64748b; }
    .meta span { color: #94a3b8; }

    .countdown {
      margin-left: auto;
      color: #475569;
      font-size: 0.75rem;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    section {
      background: #1a1d2e;
      border: 1px solid #2d3250;
      border-radius: 12px;
      overflow: hidden;
    }
    section h2 {
      padding: 16px 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 1px solid #2d3250;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Config table */
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 12px 20px;
      text-align: left;
      border-bottom: 1px solid #1e2338;
      font-size: 0.875rem;
    }
    th { color: #64748b; font-weight: 500; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    td:first-child { color: #a5b4fc; font-family: 'Courier New', monospace; width: 40%; }
    td:last-child { color: #e2e8f0; font-family: 'Courier New', monospace; }
    tr:last-child td { border-bottom: none; }

    tr.changed {
      animation: flash 1.5s ease-out;
    }
    @keyframes flash {
      0%   { background: #3d2c00; }
      30%  { background: #4a3500; }
      100% { background: transparent; }
    }

    /* Layers section */
    .layers-section { grid-column: 1 / -1; }
    .layer-item {
      padding: 12px 20px;
      border-bottom: 1px solid #1e2338;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.875rem;
    }
    .layer-item:last-child { border-bottom: none; }
    .scope-badge {
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      min-width: 60px;
      text-align: center;
    }
    .scope-global    { background: #1e3a5f; color: #60a5fa; }
    .scope-region    { background: #1a3a2f; color: #34d399; }
    .scope-group     { background: #3a2a1a; color: #fb923c; }
    .scope-service   { background: #2a1a3a; color: #c084fc; }

    .layer-key { color: #a5b4fc; font-family: monospace; flex: 1; }
    .layer-meta { color: #64748b; font-size: 0.75rem; }

    /* Changes section */
    .changes-section { grid-column: 1 / -1; }
    .change-entry {
      padding: 14px 20px;
      border-bottom: 1px solid #1e2338;
    }
    .change-entry:last-child { border-bottom: none; }
    .change-timestamp {
      color: #64748b;
      font-size: 0.75rem;
      margin-bottom: 8px;
      font-family: monospace;
    }
    .change-diff {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .diff-item {
      background: #1e2338;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-family: monospace;
    }
    .diff-key { color: #a5b4fc; }
    .diff-arrow { color: #475569; margin: 0 4px; }
    .diff-old { color: #f87171; text-decoration: line-through; }
    .diff-new { color: #4ade80; }
    .empty-state {
      padding: 32px 20px;
      text-align: center;
      color: #475569;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

<header>
  <h1>ConfigSphere</h1>
  <span class="service-badge">payment-svc</span>
</header>

<div class="status-bar" id="status-bar">
  <span id="conn-indicator">
    <span class="status-dot"></span>
    <span class="status-label">Connecting...</span>
  </span>
  <span class="meta">ETag: <span id="etag">—</span></span>
  <span class="meta">Last updated: <span id="last-updated">—</span></span>
  <span class="countdown" id="countdown">Refreshing in 3s</span>
</div>

<main>
  <section>
    <h2>⚙ Current Config</h2>
    <table>
      <thead><tr><th>Key</th><th>Value</th></tr></thead>
      <tbody id="config-body">
        <tr><td colspan="2" style="color:#475569;padding:24px;text-align:center">Loading...</td></tr>
      </tbody>
    </table>
  </section>

  <section>
    <h2>🔗 Config Layers</h2>
    <div id="layers-list">
      <div class="empty-state">Loading...</div>
    </div>
  </section>

  <section class="changes-section">
    <h2>📋 Change History</h2>
    <div id="changes-list">
      <div class="empty-state">No changes detected yet. Edit a config value in the ConfigSphere admin to see changes appear here.</div>
    </div>
  </section>
</main>

<script>
  let prevPayload = {};
  let countdown = 3;
  let countdownTimer = null;

  function formatValue(val) {
    if (val === null || val === undefined) return '<span style="color:#475569">null</span>';
    if (typeof val === 'object') return JSON.stringify(val);
    if (typeof val === 'boolean') return `<span style="color:${val ? '#4ade80' : '#f87171'}">${val}</span>`;
    if (typeof val === 'number') return `<span style="color:#fb923c">${val}</span>`;
    return `"${val}"`;
  }

  function formatTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleTimeString();
  }

  function renderStatus(config) {
    const bar = document.getElementById('conn-indicator');
    const connected = config.connected;
    bar.className = connected ? 'connected' : 'disconnected';
    bar.innerHTML = `<span class="status-dot"></span><span class="status-label">${connected ? 'Connected ✓' : 'Disconnected ✗'}</span>`;
    document.getElementById('etag').textContent = config.etag ? config.etag.substring(0, 12) + '…' : '—';
    document.getElementById('last-updated').textContent = formatTime(config.last_updated);
  }

  function flattenPayload(payload, prefix = '') {
    const rows = [];
    for (const [k, v] of Object.entries(payload)) {
      const fullKey = prefix ? `${prefix}.${k}` : k;
      if (v !== null && typeof v === 'object' && !Array.isArray(v)) {
        rows.push(...flattenPayload(v, fullKey));
      } else {
        rows.push([fullKey, v]);
      }
    }
    return rows;
  }

  function renderConfig(payload) {
    const tbody = document.getElementById('config-body');
    const rows = flattenPayload(payload);
    tbody.innerHTML = rows.map(([key, val]) => {
      const changed = JSON.stringify(prevPayload[key]) !== JSON.stringify(val) && key in prevPayload;
      return `<tr ${changed ? 'class="changed"' : ''} data-key="${key}">
        <td>${key}</td>
        <td>${formatValue(val)}</td>
      </tr>`;
    }).join('');
    // Store flat prev
    prevPayload = Object.fromEntries(rows);
  }

  function renderLayers(layers) {
    const el = document.getElementById('layers-list');
    if (!layers || layers.length === 0) {
      el.innerHTML = '<div class="empty-state">No layers</div>';
      return;
    }
    el.innerHTML = layers.map(l => `
      <div class="layer-item">
        <span class="scope-badge scope-${l.scope_level}">${l.scope_level}</span>
        <span class="layer-key">${l.key}</span>
        <span class="layer-meta">v${l.version_number} · id:${l.config_version_id}</span>
      </div>
    `).join('');
  }

  function renderDiffValue(v) {
    if (v === null || v === undefined) return '<span style="color:#475569">null</span>';
    if (typeof v === 'object') return JSON.stringify(v);
    return String(v);
  }

  function renderChanges(changes) {
    const el = document.getElementById('changes-list');
    if (!changes || changes.length === 0) {
      el.innerHTML = '<div class="empty-state">No changes detected yet. Edit a config value in the ConfigSphere admin to see changes appear here.</div>';
      return;
    }
    el.innerHTML = changes.map(c => {
      const diffs = Object.entries(c.diff).map(([k, change]) => `
        <span class="diff-item">
          <span class="diff-key">${k}</span>
          <span class="diff-arrow">:</span>
          <span class="diff-old">${renderDiffValue(change.old)}</span>
          <span class="diff-arrow">→</span>
          <span class="diff-new">${renderDiffValue(change.new)}</span>
        </span>
      `).join('');
      return `
        <div class="change-entry">
          <div class="change-timestamp">${new Date(c.timestamp).toLocaleString()}</div>
          <div class="change-diff">${diffs}</div>
        </div>
      `;
    }).join('');
  }

  async function refresh() {
    try {
      const [configRes, changesRes] = await Promise.all([
        fetch('/config'),
        fetch('/changes'),
      ]);
      const config = await configRes.json();
      const changes = await changesRes.json();
      renderStatus(config);
      renderConfig(config.payload || {});
      renderLayers(config.layers || []);
      renderChanges(changes);
    } catch (e) {
      document.getElementById('conn-indicator').className = 'disconnected';
      document.getElementById('conn-indicator').innerHTML =
        '<span class="status-dot"></span><span class="status-label">Disconnected ✗</span>';
    }
  }

  function startCountdown() {
    countdown = 3;
    clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
      countdown--;
      document.getElementById('countdown').textContent = `Refreshing in ${countdown}s`;
      if (countdown <= 0) {
        clearInterval(countdownTimer);
        refresh().then(() => startCountdown());
      }
    }, 1000);
  }

  refresh().then(() => startCountdown());
</script>
</body>
</html>
