services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: configsphere_v2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data

  dynamodb-local:
    image: amazon/dynamodb-local:2.5.3
    user: root
    entrypoint:
      - sh
      - -c
    command:
      - "mkdir -p /data && java -Djava.library.path=./DynamoDBLocal_lib -jar DynamoDBLocal.jar -sharedDb -dbPath /data"
    volumes:
      - dynamodb_data:/data
    ports:
      - "8002:8000"

  redis:
    image: redis:7.2-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"

  control-plane:
    build:
      context: .
      dockerfile: services/control-plane/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      dynamodb-local:
        condition: service_started
    ports:
      - "8100:8100"
    volumes:
      - ./services/control-plane:/app
      - ./shared:/shared

  delivery:
    build:
      context: .
      dockerfile: services/delivery/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
    depends_on:
      postgres:
        condition: service_healthy
      dynamodb-local:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8101:8101"
    volumes:
      - ./services/delivery:/app
      - ./shared:/shared

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JIRA_ENABLED: ${JIRA_ENABLED:-false}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_USER_EMAIL: ${JIRA_USER_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-CS}
      JIRA_ISSUE_TYPE: ${JIRA_ISSUE_TYPE:-Task}
      JIRA_TRANSITION_APPROVED: ${JIRA_TRANSITION_APPROVED:-}
      JIRA_TRANSITION_IMPLEMENTING: ${JIRA_TRANSITION_IMPLEMENTING:-}
      JIRA_TRANSITION_IMPLEMENTED: ${JIRA_TRANSITION_IMPLEMENTED:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      dynamodb-local:
        condition: service_started
    volumes:
      - ./services/worker:/app
      - ./shared:/shared

  frontend:
    profiles: ["ui"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_CONTROL_PLANE_URL: http://localhost:8100
      VITE_DELIVERY_URL: http://localhost:8101
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: configsphere
    ports:
      - "3001:3001"
    depends_on:
      - control-plane
      - delivery
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  dynamodb_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  redis_data:
