services:
  demo-service-01: &demo-service
    build:
      context: .
      dockerfile: services/demo-service/Dockerfile
    environment:
      DELIVERY_BASE_URL: http://host.docker.internal:8101
      DELIVERY_SERVICE_NAME: payments
      CONFIG_PATH: /global
      CONFIG_TOKEN: ${DEMO_CONFIG_TOKEN_01:-${DEMO_CONFIG_TOKEN:-replace-me}}
      POLL_INTERVAL_SECONDS: 4
      INSTANCE_COUNT: 1
      DEMO_SERVICE_ALIAS: payments-demo-01
      INSTANCE_PREFIX: payments-demo-01
    extra_hosts:
      - "host.docker.internal:host-gateway"

  demo-service-02:
